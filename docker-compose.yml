services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: medialux
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d medialux"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        WITH_ML: "0"
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/medialux
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    volumes:
      - search_artifacts:/app/search_artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  search_artifacts:
